name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (coverage)
        run: npm run test

      - name: Build
        run: npm run build

      - name: Theme build proof (real astro build, emitted CSS/HTML inspection)
        run: npm run verify:theme

      - name: Admin access gate proof (real server + real HTTP requests)
        run: npm run verify:admin-server

      - name: Content collections proof (real getCollection())
        run: npm run verify:content

      - name: Frontmatter round-trip proof (real astro build)
        run: npm run verify:frontmatter
