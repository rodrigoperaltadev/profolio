schema: spec-driven

context: |
  Project: profolio (git-as-CMS content/blog engine, open source, reusable/themeable)
  Stack: Astro (decided; no scaffold yet)
  Architecture: not yet defined — repo scaffold is the first build step
  Testing: Vitest + @vitest/coverage-v8, 80% threshold (see rules.apply/verify below)
  Build order: tracked as GitHub issues #1-#8 in this repo (backend: github)

strict_tdd: true # flipped in Phase 5 (repo-scaffold-ci-foundation, PR5) — Vitest + coverage gate now exist

testing:
  status: configured
  detected_date: "2026-07-27"
  runner: vitest
  layers:
    unit: true
    integration: false
    e2e: false
  coverage:
    available: true
    tool: "@vitest/coverage-v8"
    threshold: 80
    command: "npm run test"
  quality:
    linter: eslint
    type_checker: tsc
    formatter: prettier
  note: >
    Repo scaffold + test framework + CI coverage gate landed in
    repo-scaffold-ci-foundation (issues #1-#2). Unit layer covered via
    Vitest, co-located `.test.ts` files; integration/e2e deferred to the
    change that introduces a real content model and view layer.

rules:
  proposal:
    - Include rollback plan for risky changes
    - Cross-reference the relevant open GitHub issue (#1-#8) driving the change
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
    - Content model and view layer MUST be designed as separate layers (no content-type leakage into presentation)
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - The first change (issue #1) MUST establish the test runner and CI coverage gate before any feature-code change is planned
  apply:
    - Follow existing code patterns once established
    tdd: true
    test_command: "npm run test"
  verify:
    test_command: "npm run test"
    build_command: "npm run build"
    coverage_threshold: 80
  archive:
    - Warn before merging destructive deltas
